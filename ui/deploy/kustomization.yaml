apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: insights-system

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml

images:
  - name: insights-ui
    newName: insights-ui
    newTag: dev

commonLabels:
  app.kubernetes.io/name: insights-ui
  app.kubernetes.io/component: ui
  app.kubernetes.io/part-of: insights

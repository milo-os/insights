apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-ui
  namespace: insights-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insights-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insights-ui
    spec:
      serviceAccountName: insights-ui
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Main UI container
        - name: ui
          image: insights-ui:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: insights-ui-config
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsUser: 1001
            runAsGroup: 1001
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-apiserver
  labels:
    app.kubernetes.io/name: insights
    app.kubernetes.io/component: apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insights
      app.kubernetes.io/component: apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insights
        app.kubernetes.io/component: apiserver
    spec:
      serviceAccountName: insights-apiserver
      containers:
        - name: apiserver
          image: insights-apiserver:latest
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=8443
            - --etcd-servers=http://etcd.insights-system.svc:2379
            - --cert-dir=/tmp/certs
            # Authentication config for aggregated apiserver
            # Reads requestheader CA from extension-apiserver-authentication ConfigMap in kube-system
            - --authentication-tolerate-lookup-failure=true
            # Allow anonymous access for healthz/discovery
            - --authorization-always-allow-paths=/healthz,/readyz,/livez,/openapi/*
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: cert-dir
              mountPath: /tmp/certs
      volumes:
        - name: cert-dir
          emptyDir: {}

# This RoleBinding MUST be in kube-system namespace
# Applied separately from main kustomization to avoid namespace override
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insights-apiserver-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: insights-apiserver
    namespace: insights-system

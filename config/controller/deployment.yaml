apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-controller
  namespace: insights-system
  labels:
    app.kubernetes.io/name: insights
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: insights
      app.kubernetes.io/component: controller
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insights
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: insights
    spec:
      serviceAccountName: insights-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: insights-controller:latest
          imagePullPolicy: IfNotPresent
          command:
            - /insights-controller
          args:
            - -insights-apiserver-url=https://insights-apiserver.insights-system.svc:443
            - -metrics-bind-address=:8080
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
